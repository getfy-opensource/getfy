; Docker / PHP-FPM — limites padrão da imagem bloqueiam PDFs grandes (post_max_size ~8M).
; Alinhado a config/member_builder_uploads.php (até 50 MB no Laravel) e margem para multipart.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 80
max_input_time = 300
max_execution_time = 300

; Segurança: CVE-2026-115560 (advisory php.net de 23/10/2026, ainda sem patch) e CVE-2026-109619.
; Desliga o rastreio de progresso de upload por sessão (o Getfy não usa; a sessão é a do Laravel).
; Precisa ficar no php.ini (aplicado antes do parse da request); ini_set() não protege.
session.upload_progress.enabled = 0
